name: Package extension
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify sources
        run: |
          node --check content.js
          node --check background.js
          node --check i18n.js
          node --test tests/*.test.cjs
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PYTAG'
          import json, os
          version = json.load(open('manifest.json'))['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Release tag does not match manifest version'
          PYTAG
      - name: Build extension ZIP
        run: python3 scripts/package-extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: nycu-e3-helper-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nycu-e3-helper-${{ github.sha }}
          path: dist
      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip --title "$RELEASE_TAG" --generate-notes
          fi
